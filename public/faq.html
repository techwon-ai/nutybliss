<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FAQ — NUTYBLISS</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
.faq-hero {
  background: var(--orange); color: #fff;
  border-bottom: 3px solid var(--ink); padding: 64px 32px;
  position: relative; overflow: hidden; text-align: center;
}
.faq-hero::before {
  content:""; position:absolute; width:400px; height:400px; border-radius:50%;
  background:var(--purple); top:-150px; left:-100px; opacity:0.2;
}
.faq-hero::after {
  content:""; position:absolute; width:300px; height:300px; border-radius:50%;
  background:var(--honey); bottom:-100px; right:-80px; opacity:0.25;
}
.faq-hero-inner { position:relative; z-index:2; max-width:700px; margin:0 auto; }
.faq-hero h1 { font-family:'Bagel Fat One',cursive; font-size:clamp(48px,7vw,96px);
  color:#fff; text-shadow:4px 4px 0 var(--ink); margin:10px 0 14px; }
.faq-hero p { font-size:18px; font-weight:500; opacity:0.95; }

.faq-body { max-width:800px; margin:0 auto; padding:80px 32px; }

/* FAQ items */
.faq-item {
  background: var(--paper); border: 2.5px solid var(--ink); border-radius: 18px;
  overflow: hidden; box-shadow: 4px 4px 0 var(--ink); margin-bottom: 14px;
  transition: transform 0.15s;
}
.faq-item.open { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
.faq-q {
  width: 100%; background: none; border: none; padding: 18px 22px;
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  text-align: left; cursor: pointer;
  font-family: 'Bagel Fat One', cursive; font-size: 18px; color: var(--purple);
}
.faq-icon {
  width: 32px; height: 32px; background: var(--orange); color: #fff;
  border: 2px solid var(--ink); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900; flex-shrink: 0;
  transition: transform 0.2s;
}
.faq-item.open .faq-icon { transform: rotate(45deg); }
.faq-a {
  display: none; padding: 0 22px 20px;
  font-size: 15px; font-weight: 500; color: var(--ink-soft); line-height: 1.65;
  border-top: 2px dashed rgba(91,42,138,0.15); margin-top: -2px; padding-top: 16px;
}
.faq-item.open .faq-a { display: block; }

/* Categories */
.faq-cat-title {
  font-family: 'Bagel Fat One', cursive; font-size: 28px; color: var(--purple);
  margin: 48px 0 20px; display: flex; align-items: center; gap: 10px;
}
.faq-cat-title:first-of-type { margin-top: 0; }

/* Contact strip */
.faq-contact {
  background: var(--purple); border-radius: 24px; border: 3px solid var(--ink);
  padding: 36px 32px; box-shadow: 6px 6px 0 var(--ink); text-align: center;
  margin-top: 56px; color: #fff;
}
.faq-contact h3 { font-family:'Bagel Fat One',cursive; font-size:28px; color:#fff; margin-bottom:10px; }
.faq-contact p { font-size:16px; font-weight:500; opacity:0.9; margin-bottom:24px; }
.faq-contact-btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }

@media (max-width:600px) {
  .faq-body { padding:48px 20px; }
  .faq-q { font-size:15px; }
}
</style>
</head>
<body>
<div id="site-nav"></div>

<section class="faq-hero">
  <div class="faq-hero-inner">
    <div class="eyebrow" style="justify-content:center;color:var(--purple);"><span class="dot" style="background:var(--purple);border-color:#fff;"></span>FAQ</div>
    <h1>Got Questions?</h1>
    <p>We've got peanut-butter-smooth answers.</p>
  </div>
</section>

<div class="faq-body">
  <div id="faq-list">
    <div class="spinner"></div>
  </div>

  <div class="faq-contact">
    <h3>Still not answered?</h3>
    <p>We're real humans who actually reply. Reach out any time.</p>
    <div class="faq-contact-btns">
      <a href="/contact.html" class="btn btn-primary">📧 Email Us</a>
      <a href="https://wa.me/919876543210" class="btn btn-ghost" target="_blank">💬 WhatsApp</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="/js/main.js"></script>
<script>
const categories = [
  { label: "🥜 About the Product", ids: ["f1","f2","f3","f4"] },
  { label: "🚚 Shipping & Orders", ids: ["f5","f7","f8"] },
  { label: "🌿 Certifications", ids: ["f6"] },
];

async function loadFaq() {
  const container = document.getElementById('faq-list');
  try {
    const res = await fetch('/api/faq');
    const { data } = await res.json();
    const faqMap = Object.fromEntries(data.map(f => [f.id, f]));

    container.innerHTML = categories.map(cat => {
      const items = cat.ids.map(id => faqMap[id]).filter(Boolean);
      return `
        <div class="faq-cat-title">${cat.label}</div>
        <div class="faq-list">
          ${items.map(f => `
            <div class="faq-item">
              <button class="faq-q">
                <span>${f.q}</span>
                <span class="faq-icon">+</span>
              </button>
              <div class="faq-a">${f.a}</div>
            </div>`).join('')}
        </div>`;
    }).join('');

    // Accordion behaviour
    document.querySelectorAll('.faq-q').forEach(btn => {
      btn.addEventListener('click', () => {
        const item = btn.closest('.faq-item');
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.faq-item.open').forEach(i => i.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
      });
    });
  } catch(e) {
    container.innerHTML = '<p style="color:var(--ink-soft)">Could not load FAQ.</p>';
  }
}
loadFaq();
</script>
</body>
</html>
